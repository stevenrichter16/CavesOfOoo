<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest Menu Test</title>
  <style>
    :root {
      --bg: #1a1d22;
      --text: #e0e0e0;
      --accent: #7eb9f7;
      --dim: #666;
      --good: #5f5;
      --bad: #f55;
      --magic: #a0f;
      --note: #aaa;
      --combat: #ffa;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 20px;
    }
    
    #game {
      display: none;
    }
    
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    #overlay > div {
      background: #1a1d22;
      border: 2px solid #2c2f33;
      border-radius: 8px;
      padding: 20px;
      max-width: 600px;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    #overlayTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--accent);
      text-align: center;
    }
    
    #overlayContent {
      flex: 1;
      overflow-y: auto;
    }
    
    #overlayHint {
      margin-top: 10px;
      text-align: center;
      color: var(--dim);
      font-size: 12px;
    }
    
    button {
      background: #2c2f33;
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-family: monospace;
    }
    
    button:hover {
      background: #3c3f43;
    }
    
    #status {
      margin-top: 20px;
      padding: 10px;
      background: #2c2f33;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Quest Menu Test</h1>
  
  <div>
    <button onclick="initQuestSystem()">1. Initialize Quest System</button>
    <button onclick="startTestQuests()">2. Start Test Quests</button>
    <button onclick="openMenu()">3. Open Quest Menu (or press Q)</button>
    <button onclick="completeObjective()">4. Complete an Objective</button>
  </div>
  
  <div id="status"></div>
  
  <!-- Game elements -->
  <div id="game"></div>
  
  <!-- Overlay for quest menu -->
  <div id="overlay">
    <div>
      <div id="overlayTitle">QUEST MENU</div>
      <div id="overlayContent"></div>
      <div id="overlayHint">Press Q or Escape to close</div>
    </div>
  </div>
  
  <script type="module">
    import { QuestManager } from './src/js/world/quests/QuestManager.js';
    import { openQuestMenu, closeQuestMenu, handleQuestMenuInput } from './src/js/ui/questMenu.js';
    
    // Create mock state
    window.STATE = {
      player: {
        gold: 0,
        experience: 0,
        inventory: [],
        quests: {
          active: [],
          completed: []
        }
      },
      flags: {},
      ui: {
        questMenuOpen: false
      },
      log: (msg, type) => {
        console.log(`[LOG] ${msg}`, type);
        document.getElementById('status').innerHTML += `<div style="color: var(--${type || 'text'})">${msg}</div>`;
      },
      render: () => console.log('[RENDER] Called')
    };
    
    window.initQuestSystem = function() {
      QuestManager.initialize(window.STATE);
      window.STATE.log('Quest system initialized', 'good');
    };
    
    window.startTestQuests = function() {
      // Start open inventory quest (MAIN)
      const started1 = QuestManager.startQuest(window.STATE, 'open_inventory_quest');
      if (started1) {
        window.STATE.log('Started: Open Inventory Quest (MAIN)', 'good');
      }
      
      // Start pot throwing quest (SIDE)
      const started2 = QuestManager.startQuest(window.STATE, 'pot_throwing_practice');
      if (started2) {
        window.STATE.log('Started: Pot Throwing Practice (SIDE)', 'good');
      }
      
      window.STATE.log(`Active quests: ${QuestManager.getActiveQuests().length}`, 'note');
      window.STATE.log(`Quests in progress: ${QuestManager.getQuestsInProgress().length}`, 'note');
    };
    
    window.openMenu = function() {
      openQuestMenu(window.STATE);
    };
    
    window.completeObjective = function() {
      // Simulate opening inventory
      QuestManager.emitEvent('INVENTORY_OPENED', { timestamp: Date.now() });
      window.STATE.log('Emitted INVENTORY_OPENED event', 'magic');
      
      // Simulate throwing a sugar pot
      setTimeout(() => {
        QuestManager.emitEvent('ITEM_THROWN', {
          item: { id: 'sugar_pot', name: 'Sugar Pot' }
        });
        window.STATE.log('Emitted ITEM_THROWN event for sugar_pot', 'magic');
      }, 500);
    };
    
    // Keyboard handler
    document.addEventListener('keydown', (e) => {
      if (!handleQuestMenuInput(window.STATE, e.key)) {
        if (e.key.toLowerCase() === 'q' && !window.STATE.ui.questMenuOpen) {
          openMenu();
        }
      }
    });
    
    // Auto-initialize on load
    window.addEventListener('load', () => {
      window.STATE.log('Page loaded. Click buttons in order to test.', 'note');
    });
  </script>
</body>
</html>
